
{% extends "base.html" %}

{% block title %}Edit Task{% endblock %}

{% block content %}

<div class="form-card">
    <h1>Edit Task</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <div class="form-group">
            <label for="title">Task Title</label>
            <input type="text"
                   id="title"
                   name="title"
                   maxlength="100"
                   value="{{ request.form.get('title', task.title) }}"
                   required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description"
                      name="description"
                      maxlength="300"
                      rows="4">{{ request.form.get('description', task.description or '') }}</textarea>
        </div>

        <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority" name="priority" required>
                <option value="Low"
                    {% if request.form.get('priority', task.priority) == 'Low' %}
                        selected
                    {% endif %}>Low</option>

                <option value="Medium"
                    {% if request.form.get('priority', task.priority) == 'Medium' %}
                        selected
                    {% endif %}>Medium</option>

                <option value="High"
                    {% if request.form.get('priority', task.priority) == 'High' %}
                        selected
                    {% endif %}>High</option>
            </select>
        </div>

        <div class="form-group">
            <label for="due_date">Due Date (Optional)</label>
            <input type="date"
                   id="due_date"
                   name="due_date"
                   value="{{ request.form.get('due_date', task.due_date.isoformat() if task.due_date else '') }}">
        </div>

        <button type="submit" class="button primary">Update Task</button>

        <a href="{{ url_for('home') }}" class="button cancel-button">
            Cancel
        </a>

    </form>
</div>

{% endblock %}
